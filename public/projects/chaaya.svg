<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)" />
  <circle cx="600" cy="350" r="400" fill="url(#glow)" />
  
  <g transform="translate(600, 360)" text-anchor="middle">
    <!-- Icon / Monogram -->
    <circle cx="0" cy="-80" r="60" fill="none" stroke="#a5b4fc" stroke-width="3" opacity="0.8"/>
    <path d="M -25 -65 Q 0 -115 25 -65 Q 0 -85 -25 -65" fill="#c7d2fe" />
    
    <!-- Title -->
    <text y="40" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="8">
      CHAAYA
    </text>
    
    <!-- Subtitle -->
    <text y="95" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#a5b4fc" letter-spacing="4">
      LIFESTYLE &amp; STUDIO
    </text>
    
    <!-- Tag -->
    <rect x="-160" y="130" width="320" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
    <text y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e0e7ff" letter-spacing="2">
      CONTEMPORARY E-COMMERCE
    </text>
  </g>
</svg>
