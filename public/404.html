    <!-- Immediate Smart SPA Redirect -->
    <script>
      (function() {
        const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
        const sectionMap = {
          'projects': '#projects',
          'about': '#about',
          'services': '#services',
          'skills': '#skills',
          'experience': '#experience',
          'contact': '#contact',
          'home': '#home'
        };

        if (sectionMap[path]) {
          window.location.replace('/' + sectionMap[path]);
        } else if (path !== '') {
          // If accessing any other path, redirect smoothly to home
          setTimeout(function() {
            window.location.replace('/');
          }, 1500);
        }
      })();
    </script>
